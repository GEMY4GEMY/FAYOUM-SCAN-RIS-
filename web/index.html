<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAYOUM SCAN RIS</title><style>
*{box-sizing:border-box;font-family:Segoe UI,Tahoma}body{margin:0;background:#eef3f8;color:#24324a}header{background:linear-gradient(90deg,#182b75,#17aeb7);color:#fff;padding:18px 24px;display:flex;justify-content:space-between}.wrap{max-width:1550px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:0 4px 18px #0001}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.f{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1}input,select,button{padding:10px;border:1px solid #ccd5e1;border-radius:8px}button{border:0;font-weight:700;cursor:pointer}.p{background:#ff8a00;color:#fff}.b{background:#2777c7;color:#fff}.g{background:#188b55;color:#fff}.x{background:#68758a;color:#fff}.hidden{display:none}.table{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;min-width:1100px}th{background:#182b75;color:#fff}td,th{padding:9px;border:1px solid #e0e6ef;text-align:center}dialog{border:0;border-radius:14px;width:94%;max-width:900px}#login{max-width:430px;margin:12vh auto}
</style></head><body><section id="login" class="card"><h2>FAYOUM SCAN RIS</h2><div class="f"><label>المستخدم</label><input id="lu" value="admin"></div><div class="f"><label>كلمة المرور</label><input id="lp" type="password"></div><br><button class="p" onclick="signin()">دخول</button><p id="err"></p></section>
<section id="app" class="hidden"><header><b>FAYOUM SCAN RIS — Server Edition <small style="opacity:.8">Beta 0.5</small></b><span><span id="lan" style="margin-left:16px;font-size:12px"></span><span id="who"></span></span></header><div class="wrap"><div class="card row"><div class="f"><label>التاريخ</label><input id="date" type="date" onchange="load()"></div><div class="f"><label>الوحدة</label><select id="unit" onchange="load();loadExamsForUnit()"><option value="all">الكل</option><option>CT</option><option>MRI</option><option>X-RAY</option><option>U/S</option><option>ECHO</option><option>PET-CT</option></select></div><div class="f"><label>بحث</label><input id="search" oninput="load()"></div><button class="p" onclick="newPatient()">+ حالة</button><button class="b" onclick="appointments.showModal();loadA()">الحجوزات</button><button class="b" onclick="management.showModal();loadManagement()">الإدارة</button><button class="g" onclick="backup()">Backup</button><button class="b" data-perm="export" onclick="exportXLSX()">Excel XLSX</button><button class="b" onclick="printDaily()">طباعة / PDF</button><button class="x" onclick="logout()">خروج</button></div><div class="card row"><b>الحالات: <span id="count">0</span></b><b>الإجمالي: <span id="dt">0</span></b><b>المدفوع: <span id="dp">0</span></b><b>المتبقي: <span id="dr">0</span></b><b>الخصومات: <span id="dd">0</span></b><b>تعاقدات: <span id="dc">0</span></b></div><div class="card table"><table><thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>الجهة</th><th>الوحدة</th><th>الفحص</th><th>الإجمالي</th><th>الطبيب</th><th>المستخدم</th><th>إجراء</th></tr></thead><tbody id="tb"></tbody></table></div></div></section>
<dialog id="patient"><h3>إضافة حالة</h3><div class="row"><div class="f"><label>الاسم</label><input id="pn"></div><div class="f"><label>الهاتف</label><input id="ph" onblur="phoneHistory()"><small id="phinfo"></small></div><div class="f"><label>الجهة</label><select id="pay" onchange="resolvePrice()"></select></div><div class="f"><label>الفحص</label><select id="exam" onchange="resolvePrice()"></select></div><div class="f"><label>السعر</label><input id="price" type="number" oninput="calcFinance()"></div><div class="f"><label>نسبة تغطية الجهة %</label><input id="covpct" type="number" min="0" max="100" value="0" oninput="calcFinance()"></div><div class="f"><label>قيمة التغطية</label><input id="covamt" type="number" value="0" readonly></div><div class="f"><label>رسوم إضافية</label><input id="fees" type="number" value="0" oninput="calcFinance()"></div><div class="f"><label>خصم إضافي</label><input id="disc" type="number" value="0" oninput="calcFinance()"></div><div class="f"><label>الإجمالي المستحق</label><input id="due" type="number" value="0" readonly></div><div class="f"><label>المدفوع</label><input id="paid" type="number" value="0" oninput="calcFinance()"></div><div class="f"><label>المتبقي</label><input id="remain" type="number" value="0" readonly></div><div class="f"><label>طريقة الدفع</label><select id="pm"><option>Cash</option><option>Visa</option><option>Transfer</option><option>Contract</option></select></div><div class="f"><label>الطبيب</label><input id="doc"></div></div><br><button class="g" onclick="save()">حفظ</button> <button class="x" onclick="patient.close()">إلغاء</button></dialog>
<dialog id="appointments"><h3>الحجوزات</h3><button class="p" onclick="newA.showModal()">+ حجز</button><div class="table"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الوحدة</th><th>الفحص</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="atb"></tbody></table></div><button class="x" onclick="appointments.close()">إغلاق</button></dialog>
<dialog id="newA"><h3>حجز جديد</h3><div class="row"><div class="f"><label>الاسم</label><input id="an"></div><div class="f"><label>الهاتف</label><input id="aph"></div><div class="f"><label>الوحدة</label><input id="au"></div><div class="f"><label>الفحص</label><input id="ae"></div><div class="f"><label>التاريخ</label><input id="ad" type="date"></div><div class="f"><label>الوقت</label><input id="at" type="time"></div></div><br><button class="g" onclick="saveA()">حفظ</button></dialog>
<dialog id="management"><h3>الإدارة</h3>
<div class="row"><button class="b" onclick="showPays()">جهات التعامل</button><button class="b" onclick="showExams()">الفحوصات</button><button class="b" onclick="showPlans()">خطط الأسعار</button><button class="b" onclick="showUsers()">المستخدمون</button><button class="b" onclick="showPermissions()">الصلاحيات</button><button class="b" onclick="showSettings()">Settings</button><button class="b" onclick="showBackups()">Backup / Restore</button><button class="b" onclick="showAudit()">Audit Log</button></div>
<div id="mg"></div><br><button class="x" onclick="management.close()">إغلاق</button></dialog>
<script>
let token="",me=null,currentPatients=[],myPerms=[];async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(u,o);if(!r.ok)throw Error((await r.json()).error||r.statusText);return r}
async function signin(){try{let x=await(await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:lu.value,password:lp.value})})).json();token=x.token;me=x.user;login.classList.add("hidden");app.classList.remove("hidden");who.textContent=me.username+" | "+me.role;date.value=new Date().toISOString().slice(0,10);ad.value=date.value;await loadLookups();await loadPerms();load();startLive()}catch(e){err.textContent=e.message}}
async function logout(){await api("/api/logout",{method:"POST"});location.reload()}async function load(){let q=new URLSearchParams({date:date.value,unit:unit.value,search:search.value});let a=await(await api("/api/patients?"+q)).json();currentPatients=a;count.textContent=a.length;loadDashboard();tb.innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.phone||""}</td><td>${x.payment_type||""}</td><td>${x.unit||""}</td><td>${x.exam||""}</td><td>${x.total_amount||0}</td><td>${x.doctor||""}</td><td>${x.username||""}</td><td><button class="b" onclick="editP(${x.id})">تعديل</button>${me&&me.role=="admin"?` <button class="x" onclick="delP(${x.id})">حذف</button>`:""}</td></tr>`).join("")}
async function save(){let f=calcFinance(),snap=JSON.stringify({price:f.price,coverage_percentage:f.coverage_percentage,coverage_amount:f.coverage_amount,additional_fees:f.additional_fees,discount:f.discount,total_amount:f.total_amount,plan_id:price.dataset.plan||null,item_id:price.dataset.item||null,payment_type:pay.value,exam:exam.value,captured_at:new Date().toISOString()});let payload={name:pn.value,phone:ph.value,payment_type:pay.value,exam:exam.value,exam_price:f.price,coverage_percentage:f.coverage_percentage,coverage_amount:f.coverage_amount,additional_fees:f.additional_fees,discount:f.discount,total_amount:f.total_amount,paid_amount:f.paid_amount,remaining_amount:f.remaining_amount,payment_method:pm.value,price_plan_id:price.dataset.plan||null,price_plan_item_id:price.dataset.item||null,price_snapshot:snap,doctor:doc.value,username:me.username,unit:unit.value=="all"?"":unit.value,case_date:date.value,timestamp:new Date().toISOString()};let id=patient.dataset.edit;if(id){payload.row_version=+patient.dataset.version;await api("/api/patients/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});delete patient.dataset.edit;delete patient.dataset.version}else await api("/api/patients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});patient.close();load()}
async function loadA(){let a=await(await api("/api/appointments?date="+date.value)).json();atb.innerHTML=a.map(x=>`<tr><td>${x.patient_name}</td><td>${x.phone}</td><td>${x.unit}</td><td>${x.exam||""}</td><td>${x.appointment_date}</td><td>${x.appointment_time||""}</td><td>${x.status}</td><td><select onchange="setAStatus(${x.id},${x.row_version},this.value)"><option value="">تغيير الحالة</option><option>Booked</option><option>Arrived</option><option>In Progress</option><option>Completed</option><option>Delivered</option><option>Cancelled</option></select> <button class="g" onclick="convertA(${x.id})">تحويل</button></td></tr>`).join("")}
async function saveA(){await api("/api/appointments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patient_name:an.value,phone:aph.value,unit:au.value,exam:ae.value,appointment_date:ad.value,appointment_time:at.value,status:"Booked",created_by:me.username})});newA.close();loadA()}async function backup(){try{let x=await(await api("/api/backup",{method:"POST"})).json();alert("Backup: "+x.file)}catch(e){alert(e.message)}}

async function convertA(id){if(!confirm("تحويل الحجز إلى حالة؟"))return;try{let x=await(await api("/api/appointments/"+id+"/convert",{method:"POST"})).json();alert("تم إنشاء الحالة رقم "+x.patient_id);loadA();load()}catch(e){alert(e.message)}}
async function cancelA(id,v){try{await api("/api/appointments/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"Cancelled",row_version:v})});loadA()}catch(e){alert(e.message)}}
async function loadManagement(){mg.innerHTML="<p>اختر قسم الإدارة.</p>"}
function exportXLSX(){let q=new URLSearchParams({date:date.value,unit:unit.value});location.href="/api/export/patients.xlsx?"+q}
async function showPays(){let a=await(await api("/api/payment-types")).json();mg.innerHTML='<h4>جهات التعامل</h4><div class="row"><input id="ptn" placeholder="اسم الجهة"><input id="ptc" placeholder="التصنيف"><button class="g" onclick="addPay()">إضافة</button></div><table><tr><th>الاسم</th><th>التصنيف</th><th>إجراء</th></tr>'+a.map(x=>'<tr><td>'+x.name+'</td><td>'+(x.category||"")+'</td><td><button class="b" onclick="editPay('+x.id+',\''+encodeURIComponent(x.name)+'\',\''+encodeURIComponent(x.category||"")+'\')">تعديل</button> <button class="x" onclick="disablePay('+x.id+',\''+encodeURIComponent(x.name)+'\')">تعطيل</button></td></tr>').join("")+'</table>'}
async function addPay(){try{await api("/api/payment-types",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:ptn.value,category:ptc.value})});await loadLookups();showPays()}catch(e){alert(e.message)}}
async function editPay(id,n,c){n=decodeURIComponent(n);c=decodeURIComponent(c);let name=prompt("اسم الجهة",n);if(name===null)return;let category=prompt("التصنيف",c);if(category===null)return;try{await api("/api/payment-types/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,category})});await loadLookups();showPays()}catch(e){alert(e.message)}}
async function disablePay(id,n){if(!confirm("تعطيل جهة التعامل "+decodeURIComponent(n)+"؟\nستظل الحالات القديمة محفوظة."))return;try{await api("/api/payment-types/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:0})});await loadLookups();showPays()}catch(e){alert(e.message)}}
async function showExams(){let a=await(await api("/api/exams")).json();mg.innerHTML='<h4>الفحوصات</h4><div class="row"><select id="eu"><option>CT</option><option>MRI</option><option>X-RAY</option><option>U/S</option><option>ECHO</option><option>PET-CT</option></select><input id="en" placeholder="اسم الفحص"><input id="ep" type="number" placeholder="السعر الأساسي"><button class="g" onclick="addExam()">إضافة</button></div><table><tr><th>الوحدة</th><th>الفحص</th><th>السعر</th><th>إجراء</th></tr>'+a.map(x=>'<tr><td>'+x.unit+'</td><td>'+x.name+'</td><td>'+x.base_price+'</td><td><button class="b" onclick="editExam('+x.id+',\''+encodeURIComponent(x.unit)+'\',\''+encodeURIComponent(x.name)+'\','+(x.base_price||0)+')">تعديل</button> <button class="x" onclick="disableExam('+x.id+',\''+encodeURIComponent(x.name)+'\')">تعطيل</button></td></tr>').join("")+'</table>'}
async function addExam(){try{await api("/api/exams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({unit:eu.value,name:en.value,base_price:+ep.value||0})});await loadLookups();showExams()}catch(e){alert(e.message)}}
async function editExam(id,u,n,p){u=decodeURIComponent(u);n=decodeURIComponent(n);let unit2=prompt("الوحدة",u);if(unit2===null)return;let name=prompt("اسم الفحص",n);if(name===null)return;let price2=prompt("السعر الأساسي",p);if(price2===null)return;try{await api("/api/exams/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({unit:unit2,name,base_price:+price2||0})});await loadLookups();showExams()}catch(e){alert(e.message)}}
async function disableExam(id,n){if(!confirm("تعطيل الفحص "+decodeURIComponent(n)+"؟\nسيظل محفوظًا في الحالات القديمة."))return;try{await api("/api/exams/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:0})});await loadLookups();showExams()}catch(e){alert(e.message)}}
async function showPlans(){let [p,t]=await Promise.all([(await api("/api/price-plans")).json(),(await api("/api/payment-types")).json()]);mg.innerHTML='<h4>خطط الأسعار</h4><div class="row"><select id="ppt">'+t.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join("")+'</select><input id="ppn" placeholder="اسم الخطة"><input id="ppv" type="number" value="1"><input id="ppd" type="date" value="'+new Date().toISOString().slice(0,10)+'"><button class="g" onclick="addPlan()">إنشاء</button></div><table><tr><th>#</th><th>الجهة</th><th>الخطة</th><th>Version</th><th>من</th><th>Excel</th></tr>'+p.map(x=>'<tr><td>'+x.id+'</td><td>'+x.payment_type+'</td><td>'+x.name+'</td><td>'+x.version+'</td><td>'+x.valid_from+'</td><td><button class="b" onclick="exportPlan('+x.id+')">Excel</button> <button class="g" onclick="pickPlan('+x.id+')">Import</button></td></tr>').join("")+'</table>'}
async function addPlan(){try{await api("/api/price-plans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({payment_type_id:+ppt.value,name:ppn.value,version:+ppv.value||1,valid_from:ppd.value,active:1})});showPlans()}catch(e){alert(e.message)}}
async function showAudit(){try{let a=await(await api("/api/audit")).json();mg.innerHTML='<h4>Audit Log</h4><div class="table"><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>النوع</th><th>ID</th></tr>'+a.map(x=>'<tr><td>'+x.created_at+'</td><td>'+(x.username||"")+'</td><td>'+x.action+'</td><td>'+x.entity_type+'</td><td>'+(x.entity_id||"")+'</td></tr>').join("")+'</table></div>'}catch(e){mg.innerHTML="<p>"+e.message+"</p>"}}

function exportCSV(){let cols=["id","name","phone","payment_type","unit","exam","exam_price","discount","total_amount","doctor","username","case_date"];let q=v=>'"'+String(v??"").replaceAll('"','""')+'"';let csv="\ufeff"+cols.join(",")+"\n"+currentPatients.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n");let b=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="FayoumScan_"+date.value+".csv";a.click();URL.revokeObjectURL(a.href)}

function exportPlan(id){location.href="/api/price-plans/"+id+"/export.xlsx"}
function pickPlan(id){let i=document.createElement("input");i.type="file";i.accept=".xlsx";i.onchange=async()=>{let fd=new FormData();fd.append("file",i.files[0]);try{let r=await api("/api/price-plans/"+id+"/import.xlsx",{method:"POST",body:fd});let x=await r.json();alert("تم استيراد "+x.imported+" سعر");showPlans()}catch(e){alert(e.message)}};i.click()}

function editP(id){let x=currentPatients.find(r=>r.id===id);if(!x)return;pn.value=x.name||"";ph.value=x.phone||"";pay.value=x.payment_type||"";if(x.unit&&unit.value!=x.unit){unit.value=x.unit}loadExamsForUnit(x.exam||"");price.value=x.exam_price||0;covpct.value=x.coverage_percentage||0;fees.value=x.additional_fees||0;disc.value=x.discount||0;paid.value=x.paid_amount||0;calcFinance();pm.value=x.payment_method||"Cash";doc.value=x.doctor||"";patient.dataset.edit=id;patient.dataset.version=x.row_version;patient.showModal()}
async function delP(id){if(!confirm("تأكيد حذف الحالة؟"))return;try{await api("/api/patients/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}

async function showUsers(){try{let a=await(await api("/api/users")).json();mg.innerHTML='<h4>المستخدمون</h4><div class="row"><input id="nu" placeholder="Username"><input id="np" type="password" placeholder="Password"><select id="nr"><option>user</option><option>admin</option></select><button class="g" onclick="addUser()">إضافة</button></div><table><tr><th>المستخدم</th><th>الدور</th><th>Active</th><th>آخر دخول</th><th>إجراء</th></tr>'+a.map(x=>'<tr><td>'+x.username+'</td><td>'+x.role+'</td><td>'+x.active+'</td><td>'+(x.last_login||"")+'</td><td><button class="x" onclick="toggleUser('+x.id+','+x.active+')">'+(x.active?"إيقاف":"تفعيل")+'</button></td></tr>').join("")+'</table>'}catch(e){mg.innerHTML='<p>'+e.message+'</p>'}}
async function addUser(){try{await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:nu.value,password:np.value,role:nr.value})});showUsers()}catch(e){alert(e.message)}}
async function toggleUser(id,a){try{await api("/api/users/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:!a})});showUsers()}catch(e){alert(e.message)}}
async function showSettings(){try{let s=await(await api("/api/settings")).json();mg.innerHTML='<h4>Settings</h4><div class="f"><label>اسم المركز</label><input id="sn" value="'+(s.center_name||"FAYOUM SCAN")+'"></div><div class="f"><label>هاتف المركز</label><input id="sp" value="'+(s.center_phone||"")+'"></div><div class="f"><label>عنوان التقرير</label><input id="st" value="'+(s.report_title||"FAYOUM SCAN RIS")+'"></div><br><button class="g" onclick="saveSettings()">حفظ</button>'}catch(e){mg.innerHTML='<p>'+e.message+'</p>'}}
async function saveSettings(){try{await api("/api/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({center_name:sn.value,center_phone:sp.value,report_title:st.value})});alert("تم الحفظ")}catch(e){alert(e.message)}}
function printDaily(){let w=window.open("","_blank");let total=currentPatients.reduce((a,x)=>a+(+x.total_amount||0),0),paidT=currentPatients.reduce((a,x)=>a+(+x.paid_amount||0),0);w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>Daily Report</title><style>body{font-family:Arial;padding:25px}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #555;padding:6px;text-align:center}th{background:#ddd}@media print{button{display:none}}</style></head><body><h2>FAYOUM SCAN RIS</h2><p>التاريخ: '+date.value+' | الوحدة: '+unit.value+' | عدد الحالات: '+currentPatients.length+'</p><table><tr><th>#</th><th>الاسم</th><th>الجهة</th><th>الفحص</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الطبيب</th></tr>'+currentPatients.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.name+'</td><td>'+(x.payment_type||"")+'</td><td>'+(x.exam||"")+'</td><td>'+(x.total_amount||0)+'</td><td>'+(x.paid_amount||0)+'</td><td>'+(x.remaining_amount||0)+'</td><td>'+(x.doctor||"")+'</td></tr>').join("")+'</table><h3>الإجمالي: '+total+' | المدفوع: '+paidT+' | المتبقي: '+(total-paidT)+'</h3><button onclick="print()">طباعة / PDF</button></body></html>');w.document.close()}

let allExams=[];async function loadLookups(){try{let [p,e]=await Promise.all([(await api("/api/payment-types")).json(),(await api("/api/exams")).json()]);pay.innerHTML='<option value="">اختر الجهة</option>'+p.map(x=>'<option>'+x.name+'</option>').join("");allExams=e;loadExamsForUnit()}catch(e){}}
function loadExamsForUnit(keep=""){let u=unit.value;let rows=u=="all"?allExams:allExams.filter(x=>x.unit==u);exam.innerHTML='<option value="">اختر الفحص</option>'+rows.map(x=>'<option value="'+x.name+'">'+x.name+'</option>').join("");if(keep&&rows.some(x=>x.name==keep))exam.value=keep;else if(keep&&u=="all")exam.value=keep;price.value=0;covpct.value=0;calcFinance()}
async function calcFinance(){let p=Math.max(0,+price.value||0),c=Math.min(100,Math.max(0,+covpct.value||0)),ca=p*c/100,af=Math.max(0,+fees.value||0),d=Math.max(0,+disc.value||0),t=Math.max(0,p-ca+af-d),pd=Math.max(0,+paid.value||0),r=Math.max(0,t-pd);covamt.value=ca.toFixed(2);due.value=t.toFixed(2);remain.value=r.toFixed(2);return{price:p,coverage_percentage:c,coverage_amount:ca,additional_fees:af,discount:d,total_amount:t,paid_amount:pd,remaining_amount:r}}async function resolvePrice(){if(!exam.value)return;try{let q=new URLSearchParams({payment_type:pay.value,exam:exam.value,date:date.value});let x=await(await api("/api/pricing/resolve?"+q)).json();price.value=x.price||0;price.dataset.plan=x.plan_id||"";price.dataset.item=x.item_id||"";price.dataset.coverage=x.coverage_percentage||0;covpct.value=x.coverage_percentage||0;calcFinance()}catch(e){}}
async function loadDashboard(){try{let q=new URLSearchParams({date:date.value,unit:unit.value});let x=await(await api("/api/dashboard?"+q)).json();dt.textContent=x.total.toFixed(2);dp.textContent=x.paid.toFixed(2);dr.textContent=x.remaining.toFixed(2);dd.textContent=x.discounts.toFixed(2);dc.textContent=x.contracts}catch(e){}}
async function showBackups(){try{let a=await(await api("/api/backups")).json();mg.innerHTML='<h4>Backups</h4><button class="g" onclick="makeBackup()">إنشاء نسخة الآن</button><table><tr><th>النسخة</th><th>إجراء</th></tr>'+a.map(x=>'<tr><td>'+x+'</td><td><button class="x" onclick="restoreBackup(\''+x+'\')">Restore</button></td></tr>').join("")+'</table>'}catch(e){mg.innerHTML='<p>'+e.message+'</p>'}}
async function makeBackup(){try{let x=await(await api("/api/backup",{method:"POST"})).json();alert("تم: "+x.file);showBackups()}catch(e){alert(e.message)}}
async function restoreBackup(n){if(!confirm("سيتم استرجاع قاعدة البيانات من "+n+" وسيتم إنشاء Safety Backup أولاً. استمرار؟"))return;try{let x=await(await api("/api/backups/"+encodeURIComponent(n)+"/restore",{method:"POST"})).json();alert("تم الاسترجاع. Safety backup: "+x.safety_backup);location.reload()}catch(e){alert(e.message)}}

function newPatient(){delete patient.dataset.edit;delete patient.dataset.version;pn.value="";ph.value="";pay.value="";exam.value="";price.value=0;covpct.value=0;covamt.value=0;fees.value=0;disc.value=0;due.value=0;paid.value=0;remain.value=0;pm.value="Cash";doc.value="";delete price.dataset.plan;delete price.dataset.item;delete price.dataset.coverage;patient.showModal()}

async function setAStatus(id,v,status){if(!status)return;try{await api("/api/appointments/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,row_version:v})});loadA()}catch(e){alert(e.message);loadA()}}
async function phoneHistory(){let p=ph.value.trim();phinfo.textContent="";if(p.length<6)return;try{let x=await(await api("/api/patients/by-phone/"+encodeURIComponent(p))).json();if(x.found){let last=x.history[0];phinfo.innerHTML='مريض سابق: '+x.history.length+' زيارة — آخر زيارة '+(last.case_date||"")+' / '+(last.exam||"");if(!pn.value)pn.value=last.name||"";if(!pay.value)pay.value=last.payment_type||""}}catch(e){}}

async function showPermissions(){try{let x=await(await api("/api/permissions")).json();let all=["patient_edit","booking_manage","export","view_financial"];mg.innerHTML='<h4>صلاحيات User</h4>'+all.map(p=>'<label style="display:block;padding:7px"><input type="checkbox" class="perm" value="'+p+'" '+(x.role=="user"&&x.permissions.includes(p)?"checked":"")+'> '+p+'</label>').join("")+'<button class="g" onclick="savePermissions()">حفظ الصلاحيات</button><p>Admin يمتلك جميع الصلاحيات دائمًا.</p>'}catch(e){mg.innerHTML='<p>'+e.message+'</p>'}}
async function savePermissions(){let permissions=[...document.querySelectorAll(".perm:checked")].map(x=>x.value);try{await api("/api/permissions/user",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({permissions})});alert("تم حفظ الصلاحيات")}catch(e){alert(e.message)}}

async function loadPerms(){try{let x=await(await api("/api/permissions")).json();myPerms=x.permissions||[];applyPerms()}catch(e){}}
function can(p){return me&&me.role=="admin"||myPerms.includes("*")||myPerms.includes(p)}
function applyPerms(){document.querySelectorAll("[data-perm]").forEach(x=>x.style.display=can(x.dataset.perm)?"":"none")}
let liveTimer=null;async function healthCheck(){try{let r=await fetch("/api/health",{cache:"no-store"});if(!r.ok)throw 0;let x=await r.json();conn.textContent="● Connected";conn.style.color="#159447";if(window.lan)lan.textContent=x.lan_url?"LAN: "+x.lan_url:"";return true}catch(e){conn.textContent="● Offline";conn.style.color="#c62828";return false}}function startLive(){clearInterval(liveTimer);healthCheck();liveTimer=setInterval(async()=>{if(await healthCheck()){if(!document.querySelector("dialog[open]"))load()}},15000)}
</script></body></html>
