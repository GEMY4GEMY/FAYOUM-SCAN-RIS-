<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>REV.7 Migration</title>
<style>body{font-family:Segoe UI;max-width:900px;margin:40px auto;padding:20px}button,input{padding:10px;margin:5px}pre{background:#eee;padding:15px;white-space:pre-wrap}.warn{background:#fff3cd;padding:12px;border-radius:8px}</style>
<h2>FAYOUM SCAN RIS — نقل بيانات REV.7</h2>
<p class="warn">IndexedDB مرتبطة بعنوان الصفحة القديمة. إذا لم تجد هذه الصفحة بيانات REV.7 تلقائيًا، استخدم ملف JSON تم تصديره من النسخة القديمة ثم اختره هنا. لا يتم استيراد كلمات المرور القديمة كنص عادي؛ يتم أرشفة أسماء المستخدمين فقط ويُنشئ المدير كلمات مرور جديدة آمنة.</p>
<input id="user" value="admin"><input id="pass" type="password" placeholder="Admin password">
<button onclick="fromDb()">قراءة REV.7 من هذا المتصفح</button>
<input id="jsonfile" type="file" accept=".json,application/json"><button onclick="fromFile()">استيراد JSON</button><pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/dexie@4/dist/dexie.min.js"></script><script>
async function login(){let l=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})});let x=await l.json();if(!l.ok)throw Error(x.error);return x.token}
async function send(payload){out.textContent="جاري النقل...";let token=await login();let r=await fetch("/api/migration/rev7",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(payload)});let z=await r.json();if(!r.ok)throw Error(z.error||"Migration failed");out.textContent=JSON.stringify(z,null,2)}
async function fromDb(){try{out.textContent="جاري قراءة IndexedDB...";let db=new Dexie("FayoumScanDB_v3");db.version(1).stores({patients:"++id",exams:"++id",paymentTypes:"++id",users:"++id",settings:"key",backups:"++id"});await db.open();let [patients,exams,paymentTypes,users,settings,backups]=await Promise.all([db.patients.toArray(),db.exams.toArray(),db.paymentTypes.toArray(),db.users.toArray(),db.settings.toArray(),db.backups.toArray()]);if(!patients.length&&!exams.length&&!paymentTypes.length)throw Error("لم يتم العثور على بيانات REV.7 في origin الحالي. صدّر JSON من النسخة القديمة ثم استخدم استيراد JSON.");await send({patients,exams,paymentTypes,users,settings,backups})}catch(e){out.textContent="ERROR: "+e.message}}
async function fromFile(){try{let f=jsonfile.files[0];if(!f)throw Error("اختر ملف JSON أولًا");let x=JSON.parse(await f.text());let payload=x.data&&typeof x.data==="object"?x.data:x;await send(payload)}catch(e){out.textContent="ERROR: "+e.message}}
</script>
