name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ phase-5, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile server/app.py
      - name: Smoke tests
        run: python tests/smoke_test.py
      - name: JavaScript syntax check
        shell: pwsh
        run: |
          $html = Get-Content web/index.html -Raw
          $m = [regex]::Match($html, '<script>([\s\S]*?)</script>')
          if (-not $m.Success) { throw 'Inline JavaScript block not found' }
          Set-Content -Path web/app-check.js -Value $m.Groups[1].Value -Encoding UTF8
          node --check web/app-check.js
      - name: Build portable server
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name FayoumScanRIS-Server
          --add-data "web;web"
          --add-data "server/schema.sql;server"
          server/app.py
      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist/FayoumScanRIS-Server.exe release/FayoumScanRIS.exe
          Copy-Item START_SERVER.bat release/
          Copy-Item BETA_README_AR.md release/README_AR.md
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FayoumScanRIS-Windows-x64
          path: release/*
          if-no-files-found: error
